name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        with:
          submodules: 'true'
          lfs: false
          persist-credentials: false

      - name: Fetch LFS Objects
        run: |
          git lfs install --local
          git lfs pull
          git submodule foreach --recursive '
            git config --local --unset-all http.https://github.com/.extraheader || true
            git lfs install --local
            git lfs pull
          '

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_26.3.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            echo "Using default Xcode: $(xcode-select -p)"
          fi

      - name: Compile Feather
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make
          mkdir upload
          mv packages/* upload/

      - name: Extract Version
        id: get_version
        run: |
          VERSION=""
          APP_PLIST=$(find _build/Payload -maxdepth 2 -name Info.plist | head -n 1)
          if [ -n "$APP_PLIST" ]; then
            VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PLIST" 2>/dev/null || true)
          fi
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^FEATHER_PROJECT_VERSION=//p' Feather.xcconfig | head -n 1)
          fi
          test -n "$VERSION"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Feather-${{ env.VERSION }}-${{ github.sha }}
          path: upload/*ipa
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Feather v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          files: |
            upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
